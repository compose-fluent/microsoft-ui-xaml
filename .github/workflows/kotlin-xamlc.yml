name: Kotlin XamlCompiler

on:
  push:
    branches: [kotlin-xamlc]
    tags: ['kotlin-xamlc-v*']
    paths: ['src/XamlCompiler/**', '.github/workflows/kotlin-xamlc.yml', 'eng/**', 'Directory.Build.*']
  pull_request:
    paths: ['src/XamlCompiler/**', '.github/workflows/kotlin-xamlc.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        framework: [winui, uwp]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.14.0'
      - name: Locate installed UWP SDK compiler and contracts
        if: matrix.framework == 'uwp'
        id: sdk
        shell: pwsh
        run: |
          $kitRoot = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $sdk = Get-ChildItem -LiteralPath (Join-Path $kitRoot 'References') -Directory |
            Where-Object {
              (Test-Path -LiteralPath (Join-Path $kitRoot "bin/$($_.Name)/XamlCompiler/x64/GenXbf.dll")) -or
              (Test-Path -LiteralPath (Join-Path $kitRoot "bin/$($_.Name)/x64/GenXbf.dll"))
            } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$sdk) { throw 'No installed Windows SDK has both reference contracts and the x64 UWP GenXbf compiler.' }
          $genXbf = Join-Path $kitRoot "bin/$($sdk.Name)/XamlCompiler"
          if (!(Test-Path -LiteralPath (Join-Path $genXbf 'x64/GenXbf.dll'))) { $genXbf = Join-Path $kitRoot "bin/$($sdk.Name)" }
          "version=$($sdk.Name)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "KOTLIN_UWP_SDK_REFERENCES=$($sdk.FullName)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "KOTLIN_UWP_GENXBF=$genXbf" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Restore build and test dependencies
        shell: pwsh
        run: |
          nuget install Microsoft.MSBuildCache.Local -Version 0.1.268-preview -OutputDirectory packages -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE) { throw 'MSBuildCache restore failed' }
          $packages = @{
            'Microsoft.Windows.SDK.Contracts' = '10.0.26100.1742'
            'Microsoft.WindowsAppSDK.WinUI' = '2.3.9'
            'Microsoft.WindowsAppSDK.Foundation' = '2.3.12'
            'Microsoft.WindowsAppSDK.InteractiveExperiences' = '2.1.9'
          }
          foreach ($entry in $packages.GetEnumerator()) {
            nuget install $entry.Key -Version $entry.Value -OutputDirectory BuildOutput/ci-packages -Source https://api.nuget.org/v3/index.json -NonInteractive
            if ($LASTEXITCODE) { throw "Restore failed: $($entry.Key)" }
          }
      - name: Build executable and both shared compiler targets
        shell: pwsh
        run: |
          # The repository permits latestMajor roll-forward, but this runner's
          # VS 2022 MSBuild cannot load a .NET 10 SDK. Limit this tool build to 8.
          $sdk = (dotnet --list-sdks | Where-Object { $_ -match '^8\.' } | Select-Object -Last 1).Split(' ')[0]
          if (!$sdk) { throw '.NET 8 SDK was not installed' }
          foreach ($configPath in @('global.json', 'src/XamlCompiler/global.json')) {
            $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
            $config.sdk = @{ version = $sdk; rollForward = 'disable'; allowPrerelease = $false }
            $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM
          }
          $common = @('/restore', '/p:Configuration=Release', '/p:Platform=x64', '/p:IsInternalWinUIBuild=false', '/p:KotlinXamlFramework=${{ matrix.framework }}', "/p:NugetPackageDirectory=$env:USERPROFILE\.nuget\packages", "/p:RestorePackagesPath=$env:USERPROFILE\.nuget\packages", '/p:RestoreSources=https://api.nuget.org/v3/index.json', "/p:MSBuildCachePackageRoot=$pwd\packages\Microsoft.MSBuildCache.Local.0.1.268-preview", '/verbosity:minimal', '/nologo')
          msbuild src/XamlCompiler/Exe/Microsoft.UI.Xaml.Markup.Compiler.Executable.csproj /p:PlatformTarget=x64 /p:Prefer32Bit=false @common
          if ($LASTEXITCODE) { throw 'Executable build failed' }
          msbuild src/XamlCompiler/Microsoft.UI.Xaml.Markup.Compiler.csproj @common
          if ($LASTEXITCODE) { throw 'Shared compiler build failed' }
      - name: Package versioned compiler
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^kotlin-xamlc-v', '' } else { "0.1.0-ci.$env:GITHUB_RUN_NUMBER" }
          $sdkOptions = @{}
          if ('${{ matrix.framework }}' -eq 'uwp') { $sdkOptions.WindowsSdkVersions = @('${{ steps.sdk.outputs.version }}') }
          ./src/XamlCompiler/Tools/Package-KotlinXamlCompiler.ps1 -CompilerDirectory BuildOutput/obj/amd64fre/src/XamlCompiler/Exe/Microsoft.UI.Xaml.Markup.Compiler.Executable -Version $version -OutputDirectory BuildOutput/kotlin-release -Framework '${{ matrix.framework }}' @sdkOptions
      - name: Run packaged Kotlin compiler and existing CSharp / CppWinRT regression
        shell: pwsh
        run: |
          $refs = @(
            "$pwd/BuildOutput/ci-packages/Microsoft.Windows.SDK.Contracts.10.0.26100.1742/ref/netstandard2.0",
            "$pwd/BuildOutput/ci-packages/Microsoft.WindowsAppSDK.WinUI.2.3.9/metadata",
            "$pwd/BuildOutput/ci-packages/Microsoft.WindowsAppSDK.Foundation.2.3.12/metadata",
            "$pwd/BuildOutput/ci-packages/Microsoft.WindowsAppSDK.InteractiveExperiences.2.1.9/metadata/10.0.18362.0"
          )
          $genXbf = "$pwd/BuildOutput/ci-packages/Microsoft.WindowsAppSDK.WinUI.2.3.9/tools"
          if ('${{ matrix.framework }}' -eq 'uwp') {
            $refs = @(Get-ChildItem -LiteralPath $env:KOTLIN_UWP_SDK_REFERENCES -Filter '*.winmd' -Recurse | ForEach-Object DirectoryName | Sort-Object -Unique)
            $genXbf = $env:KOTLIN_UWP_GENXBF
          }
          $repo = $pwd.Path
          $unpacked = Join-Path $repo 'BuildOutput/kotlin-release-check'
          $archive = @(Get-ChildItem BuildOutput/kotlin-release -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected one compiler archive' }
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $unpacked
          $manifest = Get-Content -LiteralPath "$unpacked/kotlin-xamlc.json" -Raw | ConvertFrom-Json
          if ($manifest.runtime.kind -ne 'net-framework' -or $manifest.runtime.minimumVersion -ne '4.7.2') { throw 'Missing compiler runtime prerequisite' }
          foreach ($file in $manifest.files.psobject.Properties) {
            if ((Get-FileHash -LiteralPath (Join-Path $unpacked $file.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.Value) { throw "Invalid packaged file: $($file.Name)" }
          }
          Push-Location $unpacked
          try {
            & "$repo/src/XamlCompiler/Tests/Kotlin/Test-DeclarationIndex.ps1" -Compiler "$unpacked/XamlCompiler.exe" -ReferenceDirectories $refs -OutputDirectory "$repo/BuildOutput/kotlin-tests" -Framework '${{ matrix.framework }}' -GenXbfDirectory $genXbf
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-xamlc-${{ matrix.framework }}-win-x64
          path: |
            BuildOutput/kotlin-release/*.zip
            BuildOutput/kotlin-release/*.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-xamlc-${{ matrix.framework }}-test-results
          path: BuildOutput/kotlin-tests
  release:
    if: startsWith(github.ref, 'refs/tags/kotlin-xamlc-v')
    needs: compiler
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kotlin-xamlc-*-win-x64
          merge-multiple: true
          path: BuildOutput/kotlin-release
      - name: Publish both framework compilers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem BuildOutput/kotlin-release -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object FullName)
          $releaseOptions = @()
          if (($env:GITHUB_REF_NAME -replace '^kotlin-xamlc-v', '') -match '-') { $releaseOptions += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @assets @releaseOptions --verify-tag --title $env:GITHUB_REF_NAME --notes 'Kotlin XamlCompiler protocol v3 for WinUI and UWP: x:Properties, typed compiled bindings, template scopes, x:Phase and deferred elements. Select the matching framework archive; GenXbf comes from its Windows App SDK package or Windows SDK.'
          if ($LASTEXITCODE) { throw 'Release upload failed' }
