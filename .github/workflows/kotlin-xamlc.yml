name: Kotlin XamlCompiler

on:
  push:
    branches: [kotlin-xamlc]
    tags: ['kotlin-xamlc-v*']
    paths: ['src/XamlCompiler/**', '.github/workflows/kotlin-xamlc.yml', 'eng/**', 'Directory.Build.*']
  pull_request:
    paths: ['src/XamlCompiler/**', '.github/workflows/kotlin-xamlc.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.14.0'
      - name: Restore build and test dependencies
        shell: pwsh
        run: |
          nuget install Microsoft.MSBuildCache.Local -Version 0.1.268-preview -OutputDirectory packages -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE) { throw 'MSBuildCache restore failed' }
          $packages = @{
            'Microsoft.Windows.SDK.Contracts' = '10.0.26100.1742'
            'Microsoft.WindowsAppSDK.WinUI' = '2.3.9'
            'Microsoft.WindowsAppSDK.Foundation' = '2.3.12'
            'Microsoft.WindowsAppSDK.InteractiveExperiences' = '2.1.9'
          }
          foreach ($entry in $packages.GetEnumerator()) {
            nuget install $entry.Key -Version $entry.Value -OutputDirectory BuildOutput/ci-packages -Source https://api.nuget.org/v3/index.json -NonInteractive
            if ($LASTEXITCODE) { throw "Restore failed: $($entry.Key)" }
          }
      - name: Build executable and both shared compiler targets
        shell: pwsh
        run: |
          # The repository permits latestMajor roll-forward, but this runner's
          # VS 2022 MSBuild cannot load a .NET 10 SDK. Limit this tool build to 8.
          $sdk = (dotnet --list-sdks | Where-Object { $_ -match '^8\.' } | Select-Object -Last 1).Split(' ')[0]
          if (!$sdk) { throw '.NET 8 SDK was not installed' }
          foreach ($configPath in @('global.json', 'src/XamlCompiler/global.json')) {
            $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
            $config.sdk = @{ version = $sdk; rollForward = 'disable'; allowPrerelease = $false }
            $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM
          }
          $common = @('/restore', '/p:Configuration=Release', '/p:Platform=x64', '/p:IsInternalWinUIBuild=false', "/p:NugetPackageDirectory=$env:USERPROFILE\.nuget\packages", "/p:RestorePackagesPath=$env:USERPROFILE\.nuget\packages", '/p:RestoreSources=https://api.nuget.org/v3/index.json', "/p:MSBuildCachePackageRoot=$pwd\packages\Microsoft.MSBuildCache.Local.0.1.268-preview", '/verbosity:minimal', '/nologo')
          msbuild src/XamlCompiler/Exe/Microsoft.UI.Xaml.Markup.Compiler.Executable.csproj /p:PlatformTarget=x64 /p:Prefer32Bit=false @common
          if ($LASTEXITCODE) { throw 'Executable build failed' }
          msbuild src/XamlCompiler/Microsoft.UI.Xaml.Markup.Compiler.csproj @common
          if ($LASTEXITCODE) { throw 'Shared compiler build failed' }
      - name: Package versioned compiler
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^kotlin-xamlc-v', '' } else { "0.1.0-ci.$env:GITHUB_RUN_NUMBER" }
          ./src/XamlCompiler/Tools/Package-KotlinXamlCompiler.ps1 -CompilerDirectory BuildOutput/obj/amd64fre/src/XamlCompiler/Exe/Microsoft.UI.Xaml.Markup.Compiler.Executable -Version $version -OutputDirectory BuildOutput/kotlin-release
      - name: Run packaged Kotlin compiler and existing CSharp / CppWinRT regression
        shell: pwsh
        run: |
          $refs = @(
            "$pwd/BuildOutput/ci-packages/Microsoft.Windows.SDK.Contracts.10.0.26100.1742/ref/netstandard2.0",
            "$pwd/BuildOutput/ci-packages/Microsoft.WindowsAppSDK.WinUI.2.3.9/metadata",
            "$pwd/BuildOutput/ci-packages/Microsoft.WindowsAppSDK.Foundation.2.3.12/metadata",
            "$pwd/BuildOutput/ci-packages/Microsoft.WindowsAppSDK.InteractiveExperiences.2.1.9/metadata/10.0.18362.0"
          )
          $repo = $pwd.Path
          $unpacked = Join-Path $repo 'BuildOutput/kotlin-release-check'
          $archive = @(Get-ChildItem BuildOutput/kotlin-release -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected one compiler archive' }
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $unpacked
          $manifest = Get-Content -LiteralPath "$unpacked/kotlin-xamlc.json" -Raw | ConvertFrom-Json
          if ($manifest.runtime.kind -ne 'net-framework' -or $manifest.runtime.minimumVersion -ne '4.7.2') { throw 'Missing compiler runtime prerequisite' }
          foreach ($file in $manifest.files.psobject.Properties) {
            if ((Get-FileHash -LiteralPath (Join-Path $unpacked $file.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.Value) { throw "Invalid packaged file: $($file.Name)" }
          }
          Push-Location $unpacked
          try {
            & "$repo/src/XamlCompiler/Tests/Kotlin/Test-DeclarationIndex.ps1" -Compiler "$unpacked/XamlCompiler.exe" -ReferenceDirectories $refs -OutputDirectory "$repo/BuildOutput/kotlin-tests"
            $resourceRoot = Join-Path $repo 'BuildOutput/kotlin-package-xbf'
            New-Item -ItemType Directory -Path $resourceRoot -Force | Out-Null
            $xaml = Join-Path $resourceRoot 'Resources.xaml'
            '<ResourceDictionary xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"><SolidColorBrush x:Key="AccentBrush" Color="CornflowerBlue" /></ResourceDictionary>' | Set-Content -LiteralPath $xaml -Encoding utf8NoBOM
            $references = @($refs | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter '*.winmd' } | ForEach-Object { @{ ItemSpec = $_.FullName; FullPath = $_.FullName; IsSystemReference = $true } })
            $input = @{
              ProjectPath = "$resourceRoot/probe.proj"; ProjectName = 'probe'; RootNamespace = 'probe'; OutputType = 'WinExe'
              Language = 'Kotlin'; LanguageSourceExtension = '.kt'; IsPass1 = $true
              OutputPath = "$resourceRoot/compiled"; SavedStateFile = "$resourceRoot/state.xml"; TargetPlatformMinVersion = '10.0.19041.0'
              ReferenceAssemblies = $references; ReferenceAssemblyPaths = @($refs + "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319" | ForEach-Object { @{ ItemSpec = $_; FullPath = $_ } })
              GenXbfPath = "$repo/BuildOutput/ci-packages/Microsoft.WindowsAppSDK.WinUI.2.3.9/tools"
              XamlPages = @(@{ ItemSpec = $xaml; FullPath = $xaml }); DisableXbfGeneration = $false
            }
            $input | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath "$resourceRoot/input.json" -Encoding utf8NoBOM
            & ./XamlCompiler.exe "$resourceRoot/input.json" "$resourceRoot/declarations.json"
            if ($LASTEXITCODE) {
              Get-Content -LiteralPath "$resourceRoot/declarations.json"
              throw 'Packaged Kotlin declaration compilation failed'
            }
            $declarations = (Get-Content -LiteralPath "$resourceRoot/declarations.json" -Raw | ConvertFrom-Json).KotlinDeclarations
            $input.IsPass1 = $false
            $input.KotlinSymbols = @{ SchemaVersion = 2; DeclarationFingerprint = ('a' * 64); Declarations = $declarations; Pages = @() }
            $input | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath "$resourceRoot/input.json" -Encoding utf8NoBOM
            & ./XamlCompiler.exe "$resourceRoot/input.json" "$resourceRoot/output.json"
            if ($LASTEXITCODE) {
              Get-Content -LiteralPath "$resourceRoot/output.json"
              throw 'Packaged Kotlin XBF compilation failed'
            }
            $result = Get-Content -LiteralPath "$resourceRoot/output.json" -Raw | ConvertFrom-Json
            if (!$result.GeneratedXbfFiles.Count -or !(Get-ChildItem "$resourceRoot/compiled" -Recurse -Filter '*.xbf')) { throw 'Packaged Kotlin compiler produced no XBF' }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-xamlc-win-x64
          path: |
            BuildOutput/kotlin-release/*.zip
            BuildOutput/kotlin-release/*.sha256
      - name: Publish tagged compiler release
        if: startsWith(github.ref, 'refs/tags/kotlin-xamlc-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem BuildOutput/kotlin-release -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object FullName)
          $releaseOptions = @()
          if (($env:GITHUB_REF_NAME -replace '^kotlin-xamlc-v', '') -match '-') { $releaseOptions += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @assets @releaseOptions --verify-tag --title $env:GITHUB_REF_NAME --notes 'Kotlin XamlCompiler protocol v2: typed compiled bindings, template scopes, x:Phase and deferred elements. GenXbf is supplied by the selected Windows App SDK NuGet package.'
          if ($LASTEXITCODE) { throw 'Release upload failed' }
    permissions:
      contents: write
